<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07090d"><link rel="manifest" href="/manifest.webmanifest"><title>Holleman Command Center</title><style>:root{--bg:#07090d;--panel:#10161f;--panel2:#151d28;--line:#273241;--text:#f4f7fb;--muted:#93a0b0;--green:#77e36f;--blue:#4aa3ff;--violet:#9f7aea;--cyan:#35d2c8;--amber:#f6c85f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 72% -12%,rgba(40,72,116,.28),transparent 34%),linear-gradient(#07090d,#090c12);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px;border-right:1px solid var(--line);background:rgba(0,0,0,.27);backdrop-filter:blur(18px)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:25px}.shield{width:46px;height:52px;display:grid;place-items:center;background:var(--panel2);border:1px solid #667085;clip-path:polygon(50% 0,94% 18%,88% 76%,50% 100%,12% 76%,6% 18%);font-weight:900}.brand b{letter-spacing:.1em}.brand small{display:block;color:var(--muted);letter-spacing:.15em;font-size:9px}.nav button{width:100%;border:0;background:transparent;color:#aeb8c6;text-align:left;padding:13px;border-radius:12px;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:linear-gradient(90deg,rgba(74,163,255,.15),transparent);box-shadow:inset 3px 0 0 var(--blue);color:#fff}.quote{position:absolute;bottom:18px;left:16px;right:16px;border:1px solid var(--line);background:var(--panel);border-radius:15px;padding:15px;color:#c8d0dc;font-size:12px;line-height:1.5}.main{padding:26px 28px 50px}.top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.top h1{margin:0;font-size:30px;letter-spacing:.04em}.top p{margin:5px 0;color:var(--muted)}.save,.btn{border:1px solid #347044;background:#173724;color:#fff;border-radius:12px;padding:10px 15px;cursor:pointer}.btn.secondary{border-color:var(--line);background:#0b1017}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.scores{grid-template-columns:repeat(5,1fr);margin-top:22px}.card{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:22px;box-shadow:0 22px 65px rgba(0,0,0,.32);padding:18px}.score{text-align:center}.eyebrow{color:#adb7c5;font-size:11px;font-weight:700;letter-spacing:.15em}.ring{width:112px;height:112px;border-radius:50%;margin:14px auto;display:grid;place-items:center}.ring>div{width:86px;height:86px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:31px;font-weight:900}.state{font-size:12px;font-weight:800}.section{display:flex;align-items:flex-end;justify-content:space-between;margin:28px 2px 12px}.section h2{margin:0;font-size:14px;letter-spacing:.18em}.section span{font-size:12px;color:var(--muted)}.metrics{grid-template-columns:repeat(6,1fr)}.metric small{display:block;color:var(--muted);font-size:10px;letter-spacing:.13em}.metric strong{display:block;font-size:26px;margin:9px 0}.metric em{font-style:normal;color:var(--green);font-size:12px}.split{grid-template-columns:1.3fr 1fr}.triple{grid-template-columns:repeat(3,1fr)}.quad{grid-template-columns:repeat(4,1fr)}label.check{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}input[type=checkbox]{accent-color:var(--green)}.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}.progress i{display:block;height:100%;border-radius:99px}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.form label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;margin-top:5px;padding:10px;border-radius:10px;background:#090d13;border:1px solid var(--line);color:white}textarea{min-height:86px}.plans{grid-template-columns:repeat(3,1fr)}.exercise{border-top:1px solid var(--line);padding:11px 0;color:#d5dce6;font-size:14px}.notice{border:1px solid var(--line);background:rgba(0,0,0,.13);border-radius:14px;padding:14px;color:#bdc6d3;font-size:13px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#0b1017;border:1px solid var(--line);font-size:11px;color:#cdd5df;margin:3px}.careerHero{display:flex;justify-content:space-between;gap:20px;align-items:center}.careerHero h2{font-size:26px;margin:0 0 8px}.careerHero p{color:var(--muted);max-width:760px;line-height:1.55}.salary{font-size:28px;font-weight:900;color:var(--green);white-space:nowrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-size:10px;letter-spacing:.12em}.table input,.table select{margin:0;padding:8px}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:12px;color:var(--muted)}@media(max-width:1100px){.scores{grid-template-columns:repeat(3,1fr)}.metrics,.quad{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.app{display:block}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}.brand{margin-bottom:12px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{text-align:center;padding:10px 3px;font-size:11px}.quote{display:none}.main{padding:18px 14px 90px}.top h1{font-size:22px}.scores,.metrics,.split,.triple,.plans,.quad{grid-template-columns:1fr 1fr}.careerHero{align-items:flex-start;flex-direction:column}.table{display:block;overflow-x:auto}}@media(max-width:520px){.scores,.metrics,.split,.triple,.plans,.form,.quad{grid-template-columns:1fr}.save{display:none}.nav{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="shield">H</div><div><b>HOLLEMAN</b><small>PERSONAL COMMAND</small></div></div><div class="nav" id="nav"></div><div class="quote">DISCIPLINE TODAY<br><b>LEADS TO FREEDOM TOMORROW.</b></div></aside><main class="main"><div class="top"><div><h1>HOLLEMAN COMMAND CENTER</h1><p id="date"></p></div><button class="save" onclick="saveAll()">Save</button></div><div id="pages"></div></main></div><script>const tabs=[['dashboard','Command'],['career','Career'],['heart','Heart'],['running','Running'],['strength','Strength'],['nutrition','Nutrition'],['body','Body'],['plans','Plans'],['settings','Data']];const defaults={health:{weight:249.8,restingHr:58,hrv:63,vo2:40.1,sleep:7.7,calories:2742,protein:221,water:105},career:{applications:0,networking:0,interviews:0,activeLeads:0,readiness:42,weeklyGoal:10,targetMin:175000,targetIdeal:200000,priorities:['Finalize executive resume','Rewrite LinkedIn headline and About section','Apply to 10 targeted roles','Contact 5 recruiters or hiring leaders'],profile:'Senior operations, risk, and investigations leader with nearly 20 years of combined banking and law-enforcement experience. Led multi-state teams of approximately 50 employees across 120+ locations and now directs complex investigations with local and federal partners.',jobs:[],docs:{resume:'In Progress',linkedin:'Not Started',cover:'Not Started',stories:'In Progress'}}};let state=JSON.parse(localStorage.getItem('holleman-command-v6')||'null')||defaults;state.health={...defaults.health,...state.health};state.career={...defaults.career,...state.career};state.career.docs={...defaults.career.docs,...state.career.docs};state.career.jobs=state.career.jobs||[];function esc(v=''){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function section(t,s=''){return `<div class="section"><h2>${t}</h2><span>${s}</span></div>`}function card(label,value,sub){return `<div class="card metric"><small>${label}</small><strong>${value}</strong><em>${sub}</em></div>`}function scoreCard(label,value,color,sub){return `<div class="card score"><div class="eyebrow">${label}</div><div class="ring" style="background:conic-gradient(${color} ${value}%,#273241 0)"><div>${value}</div></div><div class="state" style="color:${color}">${sub}</div></div>`}function healthScore(){let d=state.health,s=d.sleep>=7.5?30:d.sleep>=7?25:d.sleep>=6?15:5,h=d.hrv>=60?20:d.hrv>=50?15:d.hrv>=40?10:5,r=d.restingHr<=60?20:d.restingHr<=64?15:d.restingHr<=69?10:5,hab=d.protein>=200&&d.water>=100?10:d.protein>=200||d.water>=100?8:5;return Math.min(100,s+h+r+hab+20)}function dashboard(){let d=state.health,rec=healthScore();return `<div class="grid scores">${scoreCard('RECOVERY',rec,'#77e36f',rec>=80?'READY':'WATCH')}${scoreCard('CAREER',state.career.readiness,'#4aa3ff','TRANSITION')}${scoreCard('RUN READINESS',82,'#35d2c8','GOOD')}${scoreCard('STRENGTH',87,'#9f7aea','HIGH')}<div class="card score"><div class="eyebrow">OVERALL STATUS</div><div style="font-size:58px;color:var(--green);margin:14px">⬢</div><div class="state">BUILDING MOMENTUM</div></div></div>${section('TODAY AT A GLANCE','Health and career priorities')}<div class="grid metrics">${card('RESTING HR',d.restingHr+' bpm','Current')}${card('SLEEP',d.sleep+' h','Recovery lever')}${card('WEIGHT',d.weight+' lb','Goal 235')}${card('APPLICATIONS',state.career.applications,'Weekly activity')}${card('ACTIVE LEADS',state.career.activeLeads,'In pipeline')}${card('INTERVIEWS',state.career.interviews,'Current')}</div>${section("TODAY'S MISSION")}<div class="grid split"><div class="card">${['Training session','Protein 220g+','Water 120 oz',...state.career.priorities.slice(0,2)].map((x,i)=>`<label class="check"><input type="checkbox">${esc(x)}</label>`).join('')}</div><div class="card"><div class="eyebrow">CAREER NORTH STAR</div><h3>$175K–$200K+ • REMOTE/HYBRID</h3><p class="small">Move from law enforcement into senior risk, operations, investigations, corporate security, or program leadership within 3–6 months.</p><button class="btn secondary" onclick="show('career')">Open Career Center</button></div></div>`}function career(){const c=state.career,docs=Object.entries(c.docs).map(([k,v])=>`<div class="card"><div class="eyebrow">${k.toUpperCase()}</div><h3>${esc(v)}</h3><select onchange="state.career.docs.${k}=this.value;autoSave()"><option ${v==='Not Started'?'selected':''}>Not Started</option><option ${v==='In Progress'?'selected':''}>In Progress</option><option ${v==='Ready'?'selected':''}>Ready</option></select></div>`).join('');const rows=c.jobs.length?c.jobs.map((j,i)=>`<tr><td><input value="${esc(j.company)}" onchange="updateJob(${i},'company',this.value)"></td><td><input value="${esc(j.role)}" onchange="updateJob(${i},'role',this.value)"></td><td><select onchange="updateJob(${i},'status',this.value)">${['Interested','Applied','Recruiter Screen','Interview','Final Round','Offer','Closed'].map(x=>`<option ${j.status===x?'selected':''}>${x}</option>`).join('')}</select></td><td><input value="${esc(j.salary||'')}" onchange="updateJob(${i},'salary',this.value)"></td><td><input value="${esc(j.next||'')}" onchange="updateJob(${i},'next',this.value)"></td><td><button class="btn secondary" onclick="removeJob(${i})">Remove</button></td></tr>`).join(''):`<tr><td colspan="6" class="small">No opportunities added yet. Use “Add Opportunity” to start the pipeline.</td></tr>`;return `<div class="card careerHero" style="margin-top:22px"><div><div class="eyebrow">CAREER TRANSITION COMMAND</div><h2>Executive Career Operating System</h2><p>${esc(c.profile)}</p><div>${['Enterprise Risk','Corporate Investigations','Corporate Security','Program Management','Operations Leadership','Fraud / AML','Government Consulting'].map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div><div class="salary">$${Math.round(c.targetMin/1000)}K–$${Math.round(c.targetIdeal/1000)}K+</div><div class="small">Target compensation</div></div></div>${section('TRANSITION SCORECARD','Editable and saved automatically')}<div class="grid metrics">${card('READINESS',c.readiness+'%','Overall')}${card('APPLICATIONS',c.applications,'This week')}${card('NETWORKING',c.networking,'Touches')}${card('INTERVIEWS',c.interviews,'Active')}${card('ACTIVE LEADS',c.activeLeads,'Pipeline')}${card('WEEKLY GOAL',c.weeklyGoal,'Applications')}</div><div class="card" style="margin-top:14px"><div class="form"><label>Career readiness %<input type="number" min="0" max="100" value="${c.readiness}" oninput="state.career.readiness=Number(this.value);autoSave()"></label><label>Applications<input type="number" value="${c.applications}" oninput="state.career.applications=Number(this.value);autoSave()"></label><label>Networking touches<input type="number" value="${c.networking}" oninput="state.career.networking=Number(this.value);autoSave()"></label><label>Interviews<input type="number" value="${c.interviews}" oninput="state.career.interviews=Number(this.value);autoSave()"></label><label>Active leads<input type="number" value="${c.activeLeads}" oninput="state.career.activeLeads=Number(this.value);autoSave()"></label><label>Weekly application goal<input type="number" value="${c.weeklyGoal}" oninput="state.career.weeklyGoal=Number(this.value);autoSave()"></label></div></div>${section('THIS WEEK','Highest-value actions')}<div class="card">${c.priorities.map((p,i)=>`<label class="check"><input type="checkbox"><input value="${esc(p)}" onchange="state.career.priorities[${i}]=this.value;autoSave()"></label>`).join('')}</div>${section('OPPORTUNITY PIPELINE','Track every serious role')}<div class="card"><div class="actions"><button class="btn" onclick="addJob()">Add Opportunity</button><button class="btn secondary" onclick="exportData()">Export Data</button></div><table class="table"><thead><tr><th>Company</th><th>Role</th><th>Status</th><th>Compensation</th><th>Next Step</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>${section('CAREER MATERIALS')}<div class="grid quad">${docs}</div>${section('90-DAY ROADMAP')}<div class="grid triple"><div class="card"><div class="eyebrow">DAYS 1–30</div><h3>Position & Launch</h3><p class="small">Finalize executive résumé, LinkedIn, accomplishment library, and four role-specific résumé versions. Begin targeted applications and outreach.</p></div><div class="card"><div class="eyebrow">DAYS 31–60</div><h3>Build Pipeline</h3><p class="small">Maintain 10–15 quality applications weekly, expand recruiter conversations, sharpen interview stories, and evaluate certification ROI.</p></div><div class="card"><div class="eyebrow">DAYS 61–90</div><h3>Convert & Negotiate</h3><p class="small">Advance finalists, compare total compensation, negotiate flexibility and benefits, and plan an orderly law-enforcement exit.</p></div></div>${section('PROFILE & POSITIONING')}<div class="grid split"><div class="card"><label class="small">Executive positioning<textarea onchange="state.career.profile=this.value;autoSave()">${esc(c.profile)}</textarea></label></div><div class="card"><h3>Core Evidence</h3><p class="small">• Nearly 10 years in law enforcement; detective for 6 years<br>• Complex narcotics investigations and federal/local coordination<br>• Roughly 10 years in banking and financial services<br>• Former AVP, Risk Manager, Senior Branch Manager, and Team Manager<br>• Led approximately 50 employees across 120+ branches<br>• Bachelor of Business; master’s in Criminal Justice underway</p></div></div>`}function heart(){let d=state.health;return section('HEART HEALTH')+`<div class="grid metrics">${card('RESTING HR',d.restingHr+' bpm','Current')}${card('HRV',d.hrv+' ms','Current')}${card('VO₂ MAX',d.vo2,'Current')}${card('SLEEP',d.sleep+' h','Current')}</div>`}function running(){return section('RUNNING PERFORMANCE')+`<div class="grid quad">${card('WEEKLY MILEAGE','24.7 mi','On plan')}${card('LONGEST RUN','7.2 mi','Target 8–10')}${card('AVG PACE','8:42','Improving')}${card('RACE READY','68%','Trending up')}</div>`}function strength(){return section('STRENGTH PERFORMANCE')+`<div class="grid triple">${card('WEEKLY VOLUME','18,450 lb','↑ 6%')}${card('PRS THIS MONTH','7','Momentum')}${card('READINESS','87','High')}</div>`}function nutrition(){let d=state.health;return section('NUTRITION')+`<div class="grid triple">${card('CALORIES',d.calories,'Current')}${card('PROTEIN',d.protein+' g','Target 220g')}${card('WATER',d.water+' oz','Target 120 oz')}</div>`}function body(){let d=state.health;return section('BODY COMPOSITION')+`<div class="grid quad">${card('WEIGHT',d.weight+' lb','Current')}${card('GOAL','235 lb','Target')}${card('BODY FAT','18.7%','Estimated')}${card('WEEKLY CHANGE','-1.6 lb','On pace')}</div>`}function plans(){return section('WORKOUT PLAN LIBRARY')+`<div class="grid plans">${[['Arsenal Pull','High Row • Iso Multi Row • Cable Row • Rear Delts • Preacher Curl'],['Arsenal Push','Vertical Press • Incline Press • Shoulder Press • Laterals • Triceps'],['Ares 2.0 Pull','Pulldown • Single-Arm Row • Smith Row • Face Pull • Curl']].map(x=>`<div class="card"><h3>${x[0]}</h3><div class="exercise">${x[1]}</div></div>`).join('')}</div>`}function settings(){let d=state.health,fields=[['Weight','weight'],['Resting HR','restingHr'],['HRV','hrv'],['VO₂ Max','vo2'],['Sleep','sleep'],['Calories','calories'],['Protein','protein'],['Water','water']];return section('DATA & SETTINGS','Local-first')+`<div class="grid split"><div class="card"><div class="form">${fields.map(f=>`<label>${f[0]}<input type="number" step="0.1" value="${d[f[1]]}" oninput="state.health.${f[1]}=Number(this.value);autoSave()"></label>`).join('')}</div></div><div class="card"><h3>Backup & Restore</h3><p class="small">Changes save automatically on this device. Export a JSON backup for transfer or future cloud migration.</p><div class="actions"><button class="btn" onclick="exportData()">Export</button><label class="btn secondary">Import<input type="file" accept=".json" style="display:none" onchange="importData(event)"></label></div><div class="notice" style="margin-top:14px">Next architecture step: add authenticated cloud storage for seamless phone, tablet, and desktop synchronization.</div></div></div>`}const renders={dashboard,career,heart,running,strength,nutrition,body,plans,settings};function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));location.hash=id}function render(){document.getElementById('pages').innerHTML=tabs.map((t,i)=>`<section class="page ${i===0?'active':''}" id="${t[0]}">${renders[t[0]]()}</section>`).join('');let hash=location.hash.slice(1);if(renders[hash])show(hash)}function autoSave(){localStorage.setItem('holleman-command-v6',JSON.stringify(state))}function saveAll(){autoSave();alert('Command Center saved on this device.')}function addJob(){state.career.jobs.push({company:'',role:'',status:'Interested',salary:'',next:''});autoSave();render();show('career')}function updateJob(i,k,v){state.career.jobs[i][k]=v;autoSave()}function removeJob(i){state.career.jobs.splice(i,1);autoSave();render();show('career')}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='holleman-command-center-backup.json';a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);autoSave();render();alert('Data imported.')}catch{alert('Invalid backup file.')}};r.readAsText(f)}document.getElementById('date').textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'});document.getElementById('nav').innerHTML=tabs.map((t,i)=>`<button data-id="${t[0]}" class="${i===0?'active':''}" onclick="show('${t[0]}')">${t[1]}</button>`).join('');render();</script></body></html>
