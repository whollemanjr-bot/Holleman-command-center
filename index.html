<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#06111c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Holleman Command" />
  <meta name="description" content="Private personal performance, planning, career, and life command center." />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="icon" href="/icon-192.png" />
  <title>Holleman Command Center</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <noscript>This application requires JavaScript.</noscript>

  <div id="authGate" class="auth-gate hidden" aria-live="polite">
    <form id="authForm" class="auth-card">
      <div class="brand-mark large">H</div>
      <p class="eyebrow">PRIVATE ACCESS</p>
      <h1>Holleman Command Center</h1>
      <p id="authMessage" class="muted">Enter your command-center passcode.</p>
      <label class="field">Passcode
        <input id="passcodeInput" type="password" inputmode="numeric" autocomplete="current-password" required />
      </label>
      <button class="primary wide" type="submit">Unlock</button>
      <button id="useLocalMode" class="text-button hidden" type="button">Continue in local-only mode</button>
    </form>
  </div>

  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">H</div>
        <div>
          <strong>HOLLEMAN</strong>
          <small>COMMAND CENTER</small>
        </div>
      </div>
      <nav id="sidebarNav" class="side-nav" aria-label="Main navigation"></nav>
      <div class="side-section">
        <div class="section-label">SYNCS & SERVICES</div>
        <div id="sideSyncs" class="sync-list"></div>
      </div>
      <div class="version-row"><span class="status-dot ok"></span><span id="versionLabel">v1.0.0</span><span>Operational</span></div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div>
          <h1 id="greeting">Good morning, Walter.</h1>
          <p id="subtitle">Execute the day. Get better every day.</p>
        </div>
        <div class="topbar-actions">
          <div class="date-chip"><strong id="dateLabel"></strong><small>Baltimore, MD</small></div>
          <button id="searchButton" class="icon-button" title="Search" aria-label="Search">⌕</button>
          <button id="notificationButton" class="icon-button" title="Notifications" aria-label="Notifications">◉<span id="notificationBadge" class="notification-badge">0</span></button>
          <button id="profileButton" class="avatar-button" title="Settings" aria-label="Settings">WH</button>
        </div>
      </header>

      <section id="quickStats" class="quick-stats"></section>
      <section id="viewRoot" class="view-root" aria-live="polite"></section>
    </main>

    <aside id="workoutDock" class="workout-dock"></aside>

    <div class="command-bar" role="region" aria-label="Quick actions">
      <button id="commandPrompt" class="command-input"><span class="command-mic">●</span><span>Command Center AI — ask, add, schedule, analyze…</span></button>
      <div id="quickActions" class="quick-actions"></div>
    </div>
  </div>

  <dialog id="modal" class="modal">
    <form id="modalForm" method="dialog">
      <header><div><p class="eyebrow" id="modalEyebrow">COMMAND CENTER</p><h2 id="modalTitle">Update</h2></div><button class="icon-button" value="cancel" aria-label="Close">×</button></header>
      <div id="modalBody" class="modal-body"></div>
      <footer><button class="secondary" value="cancel">Cancel</button><button id="modalSubmit" class="primary" value="default">Save</button></footer>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <input id="importFile" class="hidden" type="file" accept="application/json" />
  <script src="/app.js" defer></script>
</body>
</html>
