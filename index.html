<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071019">
<link rel="manifest" href="/manifest.webmanifest">
<title>Holleman Command Center — Beta 1.0</title>
<style>
:root{--bg:#071019;--bg2:#0b1520;--panel:#0f1b28;--panel2:#132232;--line:#26384a;--text:#f4f7fb;--muted:#8fa1b5;--blue:#55a7ff;--green:#75e3a0;--amber:#f4bd62;--red:#ff7575;--violet:#a78bfa;--cyan:#5dd6d1}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% -5%,rgba(68,125,188,.18),transparent 31%),radial-gradient(circle at 5% 110%,rgba(34,197,94,.08),transparent 28%),linear-gradient(180deg,#071019,#09131d 60%,#071019)}button,input,textarea{font:inherit}.shell{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:rgba(4,10,16,.72);backdrop-filter:blur(18px)}.brand{display:flex;gap:12px;align-items:center;padding:0 8px 22px}.mark{width:42px;height:42px;border:1px solid #3f5870;background:linear-gradient(145deg,#162b3e,#0c1722);border-radius:13px;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 28px rgba(85,167,255,.08)}.brand b{display:block;letter-spacing:.14em;font-size:14px}.brand small{display:block;color:var(--muted);font-size:9px;letter-spacing:.2em;margin-top:3px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aab7c5;text-align:left;padding:12px 13px;border-radius:11px;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button span{width:23px;text-align:center}.nav button.active,.nav button:hover{background:linear-gradient(90deg,rgba(85,167,255,.16),rgba(85,167,255,.03));color:#fff;box-shadow:inset 3px 0 0 var(--blue)}.sidefoot{position:absolute;left:16px;right:16px;bottom:18px;padding:14px;border:1px solid var(--line);border-radius:15px;background:rgba(15,27,40,.72)}.sidefoot small{color:var(--muted)}.sidefoot b{display:block;margin-top:5px;font-size:12px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 12px rgba(117,227,160,.7);margin-right:6px}.main{padding:26px 30px 60px;max-width:1500px;width:100%;margin:auto}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.kicker{font-size:10px;color:var(--blue);letter-spacing:.2em;font-weight:800}.topbar h1{font-size:31px;margin:5px 0 3px;letter-spacing:-.02em}.topbar p{margin:0;color:var(--muted);font-size:13px}.topactions{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#101d2b;color:#eef4fb;border-radius:11px;padding:10px 13px;cursor:pointer}.btn.primary{background:linear-gradient(180deg,#1b588c,#16446b);border-color:#2f73aa}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1.35fr 1fr}.card{border:1px solid var(--line);border-radius:19px;background:linear-gradient(180deg,rgba(19,34,50,.96),rgba(12,24,36,.96));padding:18px;box-shadow:0 20px 55px rgba(0,0,0,.18)}.card h3{margin:0 0 12px;font-size:14px}.label{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.14em}.big{font-size:30px;font-weight:800;margin:8px 0}.small{font-size:12px;color:var(--muted);line-height:1.55}.section{display:flex;justify-content:space-between;align-items:end;margin:27px 2px 11px}.section h2{margin:0;font-size:13px;letter-spacing:.16em}.section span{font-size:11px;color:var(--muted)}.hero{display:grid;grid-template-columns:1.3fr .85fr;gap:14px}.heroMain{padding:24px;min-height:260px;background:radial-gradient(circle at 100% 0,rgba(85,167,255,.13),transparent 37%),linear-gradient(180deg,rgba(19,34,50,.97),rgba(11,22,33,.98))}.dateLine{color:var(--muted);font-size:12px}.missionTitle{font-size:36px;margin:12px 0 8px;max-width:760px;line-height:1.08}.missionCopy{max-width:680px;color:#aebac7;line-height:1.6}.priorityRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:21px}.pill{font-size:11px;border:1px solid var(--line);background:#0b1621;border-radius:999px;padding:7px 10px;color:#cbd5df}.pill.hot{border-color:#315f89;background:#10263a;color:#9dcbf5}.statusCard{display:flex;flex-direction:column;justify-content:space-between}.statusScore{width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--green) 78%,#26384a 0);display:grid;place-items:center;margin:12px auto}.statusScore div{width:92px;height:92px;border-radius:50%;background:#0e1a27;display:grid;place-items:center;text-align:center}.statusScore b{font-size:30px}.statusScore small{display:block;color:var(--muted);font-size:9px}.stream{display:grid;gap:10px}.streamItem{display:grid;grid-template-columns:9px 1fr auto;gap:11px;align-items:start;padding:12px 0;border-bottom:1px solid rgba(38,56,74,.7)}.streamItem:last-child{border-bottom:0}.streamDot{width:8px;height:8px;border-radius:50%;margin-top:5px}.streamItem b{font-size:13px}.streamItem p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.45}.streamItem time{font-size:10px;color:#718397}.task{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid rgba(38,56,74,.7)}.task:last-child{border-bottom:0}.task input{margin-top:2px;accent-color:var(--green)}.task b{font-size:13px}.task small{display:block;color:var(--muted);margin-top:3px}.meter{height:7px;background:#223245;border-radius:99px;overflow:hidden;margin-top:8px}.meter i{display:block;height:100%;border-radius:99px}.metric b{font-size:28px;display:block;margin:8px 0 4px}.metric em{font-style:normal;font-size:11px;color:var(--green)}.briefLead{font-size:23px;line-height:1.25;margin:4px 0 12px}.briefBlock{padding:14px 0;border-top:1px solid rgba(38,56,74,.7)}.briefBlock:first-of-type{border-top:0}.briefBlock b{font-size:13px}.briefBlock p{color:var(--muted);font-size:12px;line-height:1.55;margin:5px 0}.missionCard .progressHead{display:flex;justify-content:space-between;gap:10px}.missionCard strong{font-size:17px}.missionCard .small{min-height:39px}.focusClock{font-size:58px;font-weight:800;letter-spacing:-.05em;margin:10px 0}.focusInput{width:100%;background:#09131d;border:1px solid var(--line);color:#fff;border-radius:11px;padding:12px;margin-top:8px}.executeInput{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}.executeInput input{background:#09131d;border:1px solid var(--line);color:#fff;border-radius:11px;padding:11px}.source{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid rgba(38,56,74,.7)}.source:last-child{border-bottom:0}.badge{font-size:9px;border:1px solid #325b43;color:#83e2a7;background:#0f2a1b;padding:5px 7px;border-radius:999px}.badge.pending{border-color:#5d4c27;color:#f1c66e;background:#2a210f}.mobileNav{display:none}@media(max-width:1050px){.g4{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr}.g2{grid-template-columns:1fr}}@media(max-width:780px){.shell{display:block}.sidebar{display:none}.main{padding:18px 14px 90px}.topbar h1{font-size:24px}.topactions .btn:first-child{display:none}.g3,.g4{grid-template-columns:1fr 1fr}.missionTitle{font-size:29px}.mobileNav{display:grid;position:fixed;z-index:10;bottom:0;left:0;right:0;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(7px + env(safe-area-inset-bottom));background:rgba(5,12,18,.94);backdrop-filter:blur(18px);border-top:1px solid var(--line)}.mobileNav button{border:0;background:transparent;color:#7f91a3;font-size:9px;padding:7px 1px}.mobileNav button b{display:block;font-size:17px;margin-bottom:2px}.mobileNav button.active{color:#fff}}@media(max-width:520px){.g3,.g4{grid-template-columns:1fr}.topactions{display:none}.focusClock{font-size:46px}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
<div class="brand"><div class="mark">H</div><div><b>HOLLEMAN</b><small>COMMAND CENTER / BETA 1.0</small></div></div>
<nav class="nav" id="desktopNav"></nav>
<div class="sidefoot"><small><span class="dot"></span>COMMAND STATUS</small><b>Beta shell online</b><small>Live connectors staged next</small></div>
</aside>
<main class="main">
<header class="topbar"><div><div class="kicker" id="kicker">PERSONAL OPERATING SYSTEM</div><h1 id="pageTitle">Command</h1><p id="pageSub">One view of what matters now.</p></div><div class="topactions"><button class="btn" onclick="refreshNow()">Refresh</button><button class="btn primary" onclick="showPage('execute')">+ Execute</button></div></header>
<div id="pages"></div>
</main>
</div>
<nav class="mobileNav" id="mobileNav"></nav>
<script>
const tabs=[
{id:'command',icon:'⌂',name:'Command',sub:'One view of what matters now.'},
{id:'brief',icon:'☀',name:'Morning Brief',sub:'Daily intelligence before the day gets noisy.'},
{id:'mission',icon:'◎',name:'Mission',sub:'Longer-horizon priorities, projects and outcomes.'},
{id:'focus',icon:'◉',name:'Focus Mode',sub:'Reduce the system to one objective.'},
{id:'metrics',icon:'⌁',name:'Daily Metrics',sub:'Performance signals across health and execution.'},
{id:'execute',icon:'✓',name:'Execute',sub:'Capture, prioritize and close the loop.'}
];
let state=JSON.parse(localStorage.getItem('hcc-beta1')||'null')||{tasks:[{t:'Review highest-priority item for tomorrow',done:false},{t:'Complete today’s training block',done:false},{t:'Check graduate-school deadlines',done:false}],focus:'Advance the highest-leverage task',notes:''};
const intelligence=[
{c:'#55a7ff',t:'Calendar',p:'Connector-ready: today’s schedule will surface here once live calendar access is wired.',time:'STAGED'},
{c:'#75e3a0',t:'Health & Performance',p:'Daily Metrics is now the home for training, recovery, sleep and body-performance signals.',time:'READY'},
{c:'#a78bfa',t:'Career Mission',p:'Job pipeline, target roles and next actions will roll into Mission instead of living in a separate dashboard.',time:'READY'},
{c:'#f4bd62',t:'School',p:'Assignments and deadlines will feed Mission and Execute so due dates become actions, not reminders buried elsewhere.',time:'READY'}
];
function sec(a,b=''){return `<div class="section"><h2>${a}</h2><span>${b}</span></div>`}
function taskHTML(x,i){return `<label class="task"><input type="checkbox" ${x.done?'checked':''} onchange="toggleTask(${i})"><div><b>${x.t}</b><small>${x.done?'Complete':'Open'}</small></div></label>`}
function command(){return `<div class="hero"><section class="card heroMain"><div class="dateLine" id="heroDate"></div><div class="label">TODAY'S COMMAND INTENT</div><h2 class="missionTitle">Control the day before the day controls you.</h2><p class="missionCopy">Beta 1.0 is organized around decisions and execution—not app categories. Intelligence comes in, priorities get ranked, focus narrows the field, and Execute closes the loop.</p><div class="priorityRow"><span class="pill hot">#1 Mission first</span><span class="pill">Protect focus time</span><span class="pill">Train</span><span class="pill">Close open loops</span></div></section><section class="card statusCard"><div><div class="label">SYSTEM READINESS</div><div class="statusScore"><div><b>78</b><small>READY</small></div></div></div><div class="small">Readiness is a placeholder composite until live calendar, health and task connectors replace manual/static signals.</div></section></div>${sec('COMMAND STREAM','Beta architecture')}<div class="grid g2"><section class="card"><div class="stream">${intelligence.map(x=>`<div class="streamItem"><i class="streamDot" style="background:${x.c}"></i><div><b>${x.t}</b><p>${x.p}</p></div><time>${x.time}</time></div>`).join('')}</div></section><section class="card"><div class="label">NEXT ACTIONS</div><div id="commandTasks">${state.tasks.slice(0,4).map(taskHTML).join('')}</div><button class="btn" style="margin-top:12px" onclick="showPage('execute')">Open Execute →</button></section></div>${sec('MISSION PULSE')}<div class="grid g4"><div class="card metric"><div class="label">CAREER</div><b>Active</b><em>Transition pipeline</em></div><div class="card metric"><div class="label">GRAD SCHOOL</div><b>Active</b><em>Leadership track</em></div><div class="card metric"><div class="label">FITNESS</div><b>On</b><em>Daily performance</em></div><div class="card metric"><div class="label">PERSONAL</div><b>Open</b><em>Home + family ops</em></div></div>`}
function brief(){return `<div class="grid g2"><section class="card"><div class="label">MORNING BRIEF / BETA</div><h2 class="briefLead">The briefing should answer one question: what do I need to know before I start moving?</h2><div class="briefBlock"><b>1. Schedule</b><p>Today’s meetings, deadlines, travel time and conflicts will be summarized here from connected calendar data.</p></div><div class="briefBlock"><b>2. Priority intelligence</b><p>Public safety, Maryland, national policy, markets, technology/AI and other selected topics can feed this section.</p></div><div class="briefBlock"><b>3. Personal operating picture</b><p>Health readiness, training plan, school deadlines, career actions and major home/personal items collapse into one briefing.</p></div></section><section class="card"><div class="label">BRIEF SOURCES</div><div class="source"><div><b>Google Calendar</b><div class="small">Schedule + deadlines</div></div><span class="badge pending">NEXT</span></div><div class="source"><div><b>Gmail</b><div class="small">Priority inbox signals</div></div><span class="badge pending">NEXT</span></div><div class="source"><div><b>Health</b><div class="small">Readiness + trends</div></div><span class="badge pending">NEXT</span></div><div class="source"><div><b>Web intelligence</b><div class="small">News + public data</div></div><span class="badge">SUPPORTED</span></div></section></div>`}
function mission(){return `${sec('ACTIVE MISSIONS','Outcomes, not categories')}<div class="grid g3"><div class="card missionCard"><div class="label">CAREER TRANSITION</div><h3>Private-sector move</h3><p class="small">Build and execute a disciplined pipeline toward high-compensation, flexible roles.</p><div class="progressHead"><strong>Build pipeline</strong><span class="small">40%</span></div><div class="meter"><i style="width:40%;background:var(--blue)"></i></div></div><div class="card missionCard"><div class="label">GRADUATE SCHOOL</div><h3>Master’s completion</h3><p class="small">Keep assignments, drafts, deadlines and course deliverables visible.</p><div class="progressHead"><strong>Current term</strong><span class="small">Active</span></div><div class="meter"><i style="width:63%;background:var(--violet)"></i></div></div><div class="card missionCard"><div class="label">PERFORMANCE</div><h3>Health + fitness</h3><p class="small">Training, recovery, body composition and consistency roll up here.</p><div class="progressHead"><strong>Consistency</strong><span class="small">78%</span></div><div class="meter"><i style="width:78%;background:var(--green)"></i></div></div></div>${sec('MISSION DESIGN','Beta rule')}<div class="card"><p class="small" style="font-size:14px">Every item entering the Command Center should map to a mission, become an executable action, or be discarded. This keeps the dashboard from becoming another place to collect information without doing anything with it.</p></div>`}
let timer=null,seconds=25*60;function fmt(){let m=Math.floor(seconds/60),s=seconds%60;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`};function focus(){return `<div class="grid g2"><section class="card"><div class="label">CURRENT OBJECTIVE</div><input id="focusInput" class="focusInput" value="${escapeHtml(state.focus)}" onchange="state.focus=this.value;save()"><div class="focusClock" id="focusClock">${fmt()}</div><div class="topactions"><button class="btn primary" onclick="startFocus()">Start 25</button><button class="btn" onclick="resetFocus()">Reset</button></div></section><section class="card"><div class="label">FOCUS RULES</div><div class="briefBlock"><b>One objective</b><p>No parallel work during a focus block.</p></div><div class="briefBlock"><b>Silence inputs</b><p>Briefing and Command are for intake; Focus Mode is intentionally narrow.</p></div><div class="briefBlock"><b>Finish with an action</b><p>When the block ends, record the next concrete step in Execute.</p></div></section></div>`}
function metrics(){return `${sec('DAILY SIGNALS','Manual placeholders → live data')}<div class="grid g4"><div class="card metric"><div class="label">SLEEP</div><b>—</b><em>Connect Health</em></div><div class="card metric"><div class="label">RECOVERY</div><b>—</b><em>Connect Health</em></div><div class="card metric"><div class="label">TRAINING</div><b>Ready</b><em>Plan layer retained</em></div><div class="card metric"><div class="label">EXECUTION</div><b>${Math.round((state.tasks.filter(x=>x.done).length/Math.max(1,state.tasks.length))*100)}%</b><em>Tasks completed</em></div></div>${sec('WHY THIS CHANGED')}<div class="grid g2"><div class="card"><h3>Performance is one stream</h3><p class="small">The old site treated Heart, Running, Strength, Nutrition and Body as separate top-level products. Beta 1.0 keeps those signals available, but they now roll into Daily Metrics so the entire Command Center stays centered on decision-making.</p></div><div class="card"><h3>Next data layer</h3><p class="small">Health metrics, workouts, weight, sleep, nutrition and task-completion data can be wired here without changing the navigation model again.</p></div></div>`}
function execute(){return `<div class="grid g2"><section class="card"><div class="label">CAPTURE ACTION</div><div class="executeInput"><input id="newTask" placeholder="What needs to get done?" onkeydown="if(event.key==='Enter')addTask()"><button class="btn primary" onclick="addTask()">Add</button></div><div id="allTasks">${state.tasks.map(taskHTML).join('')}</div></section><section class="card"><div class="label">EXECUTION NOTE</div><textarea class="focusInput" rows="8" placeholder="Quick notes, decisions, follow-ups…" onchange="state.notes=this.value;save()">${escapeHtml(state.notes||'')}</textarea><div class="small" style="margin-top:10px">Beta stores tasks and notes locally on this device. The next step is syncing these actions to connected services rather than pretending static cards are live.</div></section></div>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function pages(){return {command:command(),brief:brief(),mission:mission(),focus:focus(),metrics:metrics(),execute:execute()}}
function render(active='command'){let p=pages();document.getElementById('pages').innerHTML=tabs.map(t=>`<section class="page ${t.id===active?'active':''}" id="page-${t.id}">${p[t.id]}</section>`).join('');buildNav(active);let d=document.getElementById('heroDate');if(d)d.textContent=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function buildNav(active){let html=tabs.map(t=>`<button class="${t.id===active?'active':''}" onclick="showPage('${t.id}')"><span>${t.icon}</span>${t.name}</button>`).join('');document.getElementById('desktopNav').innerHTML=html;document.getElementById('mobileNav').innerHTML=tabs.map(t=>`<button class="${t.id===active?'active':''}" onclick="showPage('${t.id}')"><b>${t.icon}</b>${t.name.replace('Morning ','').replace('Daily ','')}</button>`).join('')}
function showPage(id){let t=tabs.find(x=>x.id===id)||tabs[0];document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));let el=document.getElementById('page-'+id);if(!el){render(id);el=document.getElementById('page-'+id)}el.classList.add('active');document.getElementById('pageTitle').textContent=t.name;document.getElementById('pageSub').textContent=t.sub;buildNav(id);scrollTo({top:0,behavior:'smooth'})}
function save(){localStorage.setItem('hcc-beta1',JSON.stringify(state))}
function toggleTask(i){state.tasks[i].done=!state.tasks[i].done;save();let active=document.querySelector('.page.active')?.id?.replace('page-','')||'command';render(active);document.getElementById('pageTitle').textContent=tabs.find(x=>x.id===active).name;document.getElementById('pageSub').textContent=tabs.find(x=>x.id===active).sub}
function addTask(){let el=document.getElementById('newTask');let v=el?.value.trim();if(!v)return;state.tasks.unshift({t:v,done:false});save();render('execute');showPage('execute')}
function startFocus(){if(timer)return;timer=setInterval(()=>{seconds=Math.max(0,seconds-1);let el=document.getElementById('focusClock');if(el)el.textContent=fmt();if(seconds===0){clearInterval(timer);timer=null}},1000)}
function resetFocus(){if(timer)clearInterval(timer);timer=null;seconds=25*60;let el=document.getElementById('focusClock');if(el)el.textContent=fmt()}
function refreshNow(){let active=document.querySelector('.page.active')?.id?.replace('page-','')||'command';render(active);showPage(active)}
render();
</script>
</body>
</html>
