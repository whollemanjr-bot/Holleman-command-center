<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holleman Dashboard">
<link rel="manifest" href="/manifest.webmanifest">
<title>Holleman Personal Dashboard — Morning Briefing</title>
<link rel="stylesheet" href="/styles.css">
<link rel="stylesheet" href="/briefing.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><div class="crest">H</div><div><strong>HOLLEMAN</strong><small>PERSONAL DASHBOARD</small></div></div>
    <nav id="nav" class="nav"></nav>
    <div class="sidebar-bottom">
      <div class="focus-card"><small>TODAY'S FOCUS</small><b><span class="dot"></span><span id="focusLabel">Balanced</span></b></div>
      <div class="quote-card">“Discipline is the bridge between goals and accomplishment.”<b>— Jim Rohn</b></div>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <div><div id="greeting" class="greeting">GOOD EVENING, WALTER</div><h1 id="pageTitle">Morning Briefing</h1><div id="date" class="date"></div></div>
      <div class="top-actions">
        <div class="status-chip">TIME<b id="clock">--:--</b></div>
        <div class="status-chip">TODAY<b id="topFocus">Balanced</b></div>
        <div class="status-chip"><span class="dot"></span>DATA<b>Saved locally</b></div>
        <button class="btn gold" onclick="showPage('calendar')">＋ Add Event</button>
        <button class="btn" onclick="saveData(true)">↻ Save</button>
      </div>
    </header>
    <div id="pages"></div>
  </main>
</div>
<div id="toast" class="toast"></div>
<script src="/data.js"></script>
<script src="/pages-dashboard.js"></script>
<script src="/pages-performance.js"></script>
<script src="/app.js"></script>
</body>
</html>
