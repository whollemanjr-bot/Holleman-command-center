<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0b0d0f" />
<link rel="manifest" href="/manifest.webmanifest" />
<title>Holleman Command Center — Intelligence Brief</title>
<style>
:root{--bg:#0b0d0f;--panel:#121518;--panel2:#171b1f;--line:#292f34;--text:#f4f1ea;--muted:#9aa1a6;--accent:#b58a52;--accent2:#d0ad75;--green:#6fba8c;--red:#d76c6c;--blue:#7ca7c7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(circle at 88% -8%,rgba(181,138,82,.12),transparent 34%),linear-gradient(180deg,#0b0d0f,#0f1215)}button,input,textarea{font:inherit}.app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}.side{position:sticky;top:0;height:100vh;padding:20px 16px;border-right:1px solid var(--line);background:rgba(10,12,14,.9);backdrop-filter:blur(16px)}.brand{padding:4px 8px 22px}.brand .eyebrow{color:var(--accent2);font-size:9px;letter-spacing:.24em;font-weight:800}.brand h2{margin:7px 0 0;font-size:16px;letter-spacing:.08em}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#a8afb5;text-align:left;padding:12px;border-radius:10px;cursor:pointer}.nav button.active,.nav button:hover{background:linear-gradient(90deg,rgba(181,138,82,.16),transparent);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}.sideNote{position:absolute;left:16px;right:16px;bottom:18px;border:1px solid var(--line);border-radius:14px;padding:13px;background:var(--panel)}.sideNote small{color:var(--muted)}.sideNote b{display:block;margin-top:5px;font-size:12px}.main{padding:26px 30px 70px;max-width:1480px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.top .eyebrow{font-size:10px;color:var(--accent2);letter-spacing:.22em;font-weight:800}.top h1{font-family:Georgia,"Times New Roman",serif;font-weight:500;margin:7px 0 4px;font-size:39px;letter-spacing:-.02em}.date{color:var(--muted);font-size:13px}.status{border:1px solid #375246;background:#13201a;color:#9fd1b1;padding:9px 12px;border-radius:999px;font-size:11px}.page{display:none}.page.active{display:block}.grid{display:grid;gap:14px}.g2{grid-template-columns:1.45fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.card{border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,rgba(24,28,32,.97),rgba(17,20,23,.97));padding:18px;box-shadow:0 18px 46px rgba(0,0,0,.18)}.section{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 11px}.section h2{margin:0;font-size:11px;letter-spacing:.2em;color:#d9d2c7}.section span{font-size:11px;color:var(--muted)}.briefHero{padding:25px;min-height:310px;background:radial-gradient(circle at 100% 0,rgba(181,138,82,.12),transparent 38%),linear-gradient(180deg,#181c20,#111417)}.briefHero h2{font-family:Georgia,"Times New Roman",serif;font-weight:500;font-size:31px;line-height:1.12;margin:10px 0 14px}.briefHero p{max-width:820px;color:#b7bdc1;line-height:1.65;font-size:14px}.tagRow{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.tag{border:1px solid #393f44;background:#101316;color:#bfc5ca;border-radius:999px;padding:7px 10px;font-size:10px}.tag.hot{border-color:#6d5434;color:#e0bd88;background:#1d1710}.readiness{display:flex;flex-direction:column;justify-content:space-between}.ring{width:140px;height:140px;border-radius:50%;margin:12px auto;background:conic-gradient(var(--green) 82%,#2b3237 0);display:grid;place-items:center}.ring>div{width:108px;height:108px;border-radius:50%;background:#121518;display:grid;place-items:center;text-align:center}.ring b{font-size:34px}.ring small{display:block;color:var(--muted);font-size:9px}.line{height:1px;background:var(--line);margin:14px 0}.item{padding:12px 0;border-bottom:1px solid rgba(41,47,52,.78)}.item:last-child{border-bottom:0}.item b{font-size:13px}.item p{margin:5px 0 0;color:var(--muted);font-size:12px;line-height:1.5}.item .meta{font-size:10px;color:var(--accent2);margin-bottom:4px;letter-spacing:.08em}.metric b{display:block;font-size:28px;margin:8px 0 3px}.metric small{color:var(--muted)}.metric em{font-style:normal;color:var(--green);font-size:11px}.progress{height:7px;background:#252b30;border-radius:99px;overflow:hidden;margin-top:9px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}.missionRow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(41,47,52,.75)}.missionRow:last-child{border-bottom:0}.missionRow b{font-size:13px}.missionRow small{display:block;color:var(--muted);margin-top:3px}.pct{color:var(--accent2);font-size:12px}.agenda{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid rgba(41,47,52,.75)}.agenda:last-child{border-bottom:0}.time{font-size:11px;color:var(--accent2)}.task{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid rgba(41,47,52,.75)}.task:last-child{border-bottom:0}.task input{accent-color:var(--green);margin-top:2px}.task span{font-size:13px}.task small{display:block;color:var(--muted);margin-top:3px}.inputRow{display:grid;grid-template-columns:1fr auto;gap:8px}.inputRow input,.note{width:100%;background:#0e1113;border:1px solid var(--line);color:#fff;border-radius:10px;padding:11px}.btn{border:1px solid #5f4a31;background:#211a12;color:#e4c69a;border-radius:10px;padding:10px 12px;cursor:pointer}.btn.secondary{border-color:var(--line);background:#15191c;color:#d7dce0}.source{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(41,47,52,.75)}.source:last-child{border-bottom:0}.badge{font-size:9px;padding:5px 7px;border-radius:999px;border:1px solid #355143;color:#91cba5;background:#102018}.badge.pending{border-color:#5c4930;color:#d5b47d;background:#1d1710}.mobileNav{display:none}@media(max-width:1020px){.g4{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}@media(max-width:760px){.app{display:block}.side{display:none}.main{padding:18px 14px 90px}.top h1{font-size:30px}.g3,.g4{grid-template-columns:1fr 1fr}.mobileNav{display:grid;position:fixed;z-index:10;bottom:0;left:0;right:0;grid-template-columns:repeat(6,1fr);padding:6px 3px calc(7px + env(safe-area-inset-bottom));background:rgba(10,12,14,.96);backdrop-filter:blur(16px);border-top:1px solid var(--line)}.mobileNav button{border:0;background:transparent;color:#858d93;font-size:9px;padding:7px 1px}.mobileNav button b{display:block;color:inherit;font-size:16px;margin-bottom:2px}.mobileNav button.active{color:var(--accent2)}}@media(max-width:520px){.g3,.g4{grid-template-columns:1fr}.top{display:block}.status{display:inline-block;margin-top:12px}.briefHero h2{font-size:26px}}
</style>
</head>
<body>
<div class="app">
<aside class="side"><div class="brand"><div class="eyebrow">HOLLEMAN</div><h2>COMMAND CENTER</h2></div><nav class="nav" id="nav"></nav><div class="sideNote"><small>FIELD TEST BUILD</small><b>Intelligence Brief • Beta</b></div></aside>
<main class="main"><header class="top"><div><div class="eyebrow">PERSONAL OPERATIONS SYSTEM</div><h1 id="pageTitle">Intelligence Brief</h1><div class="date" id="date"></div></div><div class="status">● Local systems online</div></header><div id="pages"></div></main>
</div><nav class="mobileNav" id="mobileNav"></nav>
<script>
const tabs=[['brief','Intelligence Brief','◎'],['morning','Morning Brief','☼'],['mission','Mission','◆'],['focus','Focus Mode','◉'],['metrics','Daily Metrics','▦'],['execute','Execute','✓'],['heart','Heart','♥'],['strength','Strength','▲'],['nutrition','Nutrition','◒'],['body','Body','◌'],['plans','Workout Plans','≡'],['data','Data / Settings','⚙']];
const state=JSON.parse(localStorage.getItem('hcc-intel-beta')||'null')||{tasks:[{t:'Finish leadership strategy paper',done:false},{t:'Review next career targets',done:false},{t:'Training session',done:false}],notes:'',weight:'',sleep:'',readiness:'',protein:''};
const section=(a,b='')=>`<div class="section"><h2>${a}</h2><span>${b}</span></div>`;
function brief(){return `<div class="grid g2"><div class="card briefHero"><div class="meta" style="color:var(--accent2);font-size:10px;letter-spacing:.15em">TODAY'S INTELLIGENCE</div><h2>Your day, reduced to what actually matters.</h2><p>This field-test home screen is built around the Wednesday direction: briefing first, dashboards second. Live services are not yet connected, so this build keeps intelligence slots explicit instead of pretending static information is current.</p><div class="tagRow"><span class="tag hot">Priority intelligence</span><span class="tag">Calendar</span><span class="tag">Career</span><span class="tag">Graduate school</span><span class="tag">Performance</span></div></div><div class="card readiness"><div><div class="meta" style="color:var(--accent2);font-size:10px;letter-spacing:.14em">MISSION READINESS</div><div class="ring"><div><span><b>82</b><small>FIELD TEST</small></span></div></div></div><div><div class="line"></div><small style="color:var(--muted)">Readiness becomes live when Health data is connected.</small></div></div></div>${section('ACTIONABLE INTELLIGENCE','What needs attention')}<div class="grid g3"><div class="card"><div class="item"><div class="meta">CAREER</div><b>Career pipeline</b><p>Reserved for matched roles, application status, compensation and next action.</p></div><div class="item"><div class="meta">SCHOOL</div><b>Academic deadlines</b><p>Assignments, due dates and work-in-progress will surface here.</p></div></div><div class="card"><div class="item"><div class="meta">AGENDA</div><b>Calendar intelligence</b><p>Today's schedule, leave-time warnings and free windows will populate from Google Calendar.</p></div><div class="item"><div class="meta">INBOX</div><b>Email attention</b><p>Important Gmail threads and required responses will appear here.</p></div></div><div class="card"><div class="item"><div class="meta">PERFORMANCE</div><b>Health & training</b><p>Sleep, recovery, training recommendation, nutrition and body metrics in one concise readout.</p></div><div class="item"><div class="meta">BRIEFING</div><b>External intelligence</b><p>Maryland, public safety, politics, markets and AI headlines belong here.</p></div></div></div>${section('MISSION PROGRESS','Editable prototype')}<div class="card">${[['Career Transition',68],['Master’s Program',74],['Fitness',81],['Home & Personal',52]].map(x=>`<div class="missionRow"><div><b>${x[0]}</b><div class="progress"><i style="width:${x[1]}%"></i></div></div><div class="pct">${x[1]}%</div></div>`).join('')}</div>`}
function morning(){return `<div class="grid g2"><div class="card"><div class="meta" style="color:var(--accent2);font-size:10px;letter-spacing:.14em">MORNING BRIEF</div><h2 style="font-family:Georgia,serif;font-weight:500;font-size:28px">Start with the signal, not the noise.</h2>${['Schedule & obligations','Maryland / Baltimore','Law enforcement & public safety','Politics & policy','Markets & economy','Technology & AI'].map((x,i)=>`<div class="item"><b>${x}</b><p>${i===0?'Calendar connection pending.':'Live briefing feed pending. This section is intentionally not filled with stale placeholder headlines.'}</p></div>`).join('')}</div><div class="card"><h3>Brief settings</h3><div class="source"><span>Google Calendar</span><span class="badge pending">CONNECT</span></div><div class="source"><span>Gmail</span><span class="badge pending">CONNECT</span></div><div class="source"><span>Health</span><span class="badge pending">CONNECT</span></div><div class="source"><span>News intelligence</span><span class="badge pending">CONNECT</span></div></div></div>`}
function mission(){return `${section('ACTIVE MISSIONS','Long-horizon priorities')}<div class="grid g3">${[['Career Transition','Build a private-sector path with strong compensation and better control of time.',68],['Graduate Program','Keep coursework moving without letting deadlines pile up.',74],['Performance','Strength, conditioning, recovery and body composition.',81]].map(x=>`<div class="card"><div class="meta" style="color:var(--accent2);font-size:10px">MISSION</div><h3>${x[0]}</h3><p style="color:var(--muted);font-size:12px;line-height:1.55;min-height:58px">${x[1]}</p><div class="progress"><i style="width:${x[2]}%"></i></div><div class="pct" style="margin-top:8px">${x[2]}% complete</div></div>`).join('')}</div>`}
let timer=25*60,timerId=null;function focus(){return `<div class="grid g2"><div class="card" style="text-align:center;padding:35px"><div class="meta" style="color:var(--accent2);font-size:10px">FOCUS MODE</div><div id="clock" style="font-size:72px;font-weight:800;letter-spacing:-.05em;margin:22px 0">25:00</div><button class="btn" onclick="toggleTimer()">Start / Pause</button> <button class="btn secondary" onclick="resetTimer()">Reset</button></div><div class="card"><h3>Single objective</h3><textarea id="focusNote" class="note" rows="7" placeholder="What is the one thing that matters for this block?"></textarea></div></div>`}
function metrics(){return `${section('DAILY METRICS','Local entry until live Health sync')}<div class="grid g4">${[['Weight',state.weight||'—','lb'],['Sleep',state.sleep||'—','hours'],['Readiness',state.readiness||'—','score'],['Protein',state.protein||'—','g']].map(x=>`<div class="card metric"><small>${x[0]}</small><b>${x[1]}</b><em>${x[2]}</em></div>`).join('')}</div><div class="card" style="margin-top:14px"><div class="grid g4">${[['weight','Weight'],['sleep','Sleep'],['readiness','Readiness'],['protein','Protein']].map(x=>`<label style="font-size:11px;color:var(--muted)">${x[1]}<input style="width:100%;margin-top:6px;background:#0e1113;border:1px solid var(--line);border-radius:9px;color:#fff;padding:10px" value="${state[x[0]]}" onchange="state.${x[0]}=this.value;save()"></label>`).join('')}</div></div>`}
function execute(){return `<div class="grid g2"><div class="card"><h3>Execution queue</h3><div class="inputRow"><input id="newTask" placeholder="Add next action"><button class="btn" onclick="addTask()">Add</button></div><div id="taskList">${state.tasks.map((x,i)=>`<label class="task"><input type="checkbox" ${x.done?'checked':''} onchange="state.tasks[${i}].done=this.checked;save();render()"><span>${x.t}<small>${x.done?'Complete':'Open'}</small></span></label>`).join('')}</div></div><div class="card"><h3>Command notes</h3><textarea class="note" rows="10" oninput="state.notes=this.value;save()" placeholder="Capture decisions, follow-ups, ideas…">${state.notes}</textarea></div></div>`}
function simple(title,copy){return `<div class="card"><div class="meta" style="color:var(--accent2);font-size:10px">PERFORMANCE MODULE</div><h2>${title}</h2><p style="color:var(--muted);line-height:1.6">${copy}</p></div>`}
function heart(){return simple('Heart','Reserved for resting heart rate, HRV, cardio fitness and trend intelligence once connected to live health data.')}
function strength(){return simple('Strength','Training log, readiness, recent lifts and recommended session live here without taking over the Command home screen.')}
function nutrition(){return simple('Nutrition','Calories, protein, hydration and meal-plan visibility. Live nutrition integration is a later connection, not fake data.')}
function body(){return simple('Body Composition','Weight trend, goal progress and body composition history.')}
function plans(){return simple('Workout Plans','Your home and commercial gym workout library will live here, including Arsenal and Ares-based routines.')}
function data(){return `<div class="grid g2"><div class="card"><h3>Data sources</h3><div class="source"><span>Google Calendar</span><span class="badge pending">PENDING</span></div><div class="source"><span>Gmail</span><span class="badge pending">PENDING</span></div><div class="source"><span>Health</span><span class="badge pending">PENDING</span></div><div class="source"><span>Career pipeline</span><span class="badge pending">PENDING</span></div></div><div class="card"><h3>Local controls</h3><button class="btn secondary" onclick="exportData()">Export JSON backup</button><p style="color:var(--muted);font-size:12px">Local entries are saved on this device in browser storage.</p></div></div>`}
const funcs={brief,morning,mission,focus,metrics,execute,heart,strength,nutrition,body,plans,data};let active='brief';function render(){document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${active===t[0]?'active':''}" onclick="go('${t[0]}')">${t[2]} &nbsp; ${t[1]}</button>`).join('');document.getElementById('mobileNav').innerHTML=tabs.slice(0,6).map(t=>`<button class="${active===t[0]?'active':''}" onclick="go('${t[0]}')"><b>${t[2]}</b>${t[1].replace('Intelligence ','')}</button>`).join('');document.getElementById('pages').innerHTML=`<section class="page active">${funcs[active]()}</section>`;document.getElementById('pageTitle').textContent=tabs.find(t=>t[0]===active)[1];if(active==='focus')updateClock()}
function go(x){active=x;render();scrollTo(0,0)}function save(){localStorage.setItem('hcc-intel-beta',JSON.stringify(state))}function addTask(){let e=document.getElementById('newTask');if(!e.value.trim())return;state.tasks.push({t:e.value.trim(),done:false});save();render()}function updateClock(){let e=document.getElementById('clock');if(e)e.textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}function toggleTimer(){if(timerId){clearInterval(timerId);timerId=null}else timerId=setInterval(()=>{if(timer>0){timer--;updateClock()}else{clearInterval(timerId);timerId=null}},1000)}function resetTimer(){clearInterval(timerId);timerId=null;timer=1500;updateClock()}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='holleman-command-center-backup.json';a.click();URL.revokeObjectURL(a.href)}
document.getElementById('date').textContent=new Intl.DateTimeFormat('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date());render();
</script>
</body></html>
